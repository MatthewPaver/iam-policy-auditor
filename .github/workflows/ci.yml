name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policylens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run eval
      - run: npm run benchmark
      - name: Install browser for journey checks
        run: npx playwright install --with-deps chromium
      - name: Build the static demo used by the newly-allowed journeys
        run: npm run build:demo
      - name: Check change-review journeys
        run: npm run test:browser
      - name: Check interactive walkthrough journeys
        run: npm run test:simulation
