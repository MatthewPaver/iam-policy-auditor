name: Deploy PolicyLens to Fly.io

# Needs repo secret FLY_API_TOKEN (fly tokens create deploy)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policylens-fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pin the third-party action to a reviewed commit.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
