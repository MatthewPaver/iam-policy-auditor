# Example workflow: review IAM JSON changed in a pull request.
# Copy into .github/workflows/ and point `uses` at this repository (or a tag).

name: PolicyLens

on:
  pull_request:
    paths:
      - '**/*.json'
      - '**/*.tf'
      - '**/policy*.yaml'
      - '**/policy*.yml'

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review IAM policy changes
        uses: MatthewPaver/iam-policy-auditor@feat/lift-and-shift
        with:
          paths: '**/*.json'
          format: sarif
