name: 'PolicyLens IAM change review'
description: 'Review IAM policy changes in a pull request. Policies stay in the runner; nothing is uploaded.'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  paths:
    description: 'Glob of policy files to consider (compared to the PR base).'
    required: false
    default: '**/*.json'
  terraform-plan:
    description: 'Optional path to a Terraform plan JSON (`terraform show -json`).'
    required: false
    default: ''
  format:
    description: 'Output format: sarif, json, or text.'
    required: false
    default: 'sarif'
runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install PolicyLens dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev
    - name: Review changed policies
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_TF_PLAN: ${{ inputs.terraform-plan }}
        INPUT_FORMAT: ${{ inputs.format }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        BIN="$ACTION_PATH/bin/policylens.js"
        FORMAT="${INPUT_FORMAT:-sarif}"
        OUT="policylens-results.$FORMAT"

        if [[ -n "${INPUT_TF_PLAN}" ]]; then
          set +e
          node "$BIN" review --terraform-plan "$INPUT_TF_PLAN" --format "$FORMAT" > "$OUT"
          CODE=$?
          set -e
          exit $CODE
        fi

        if [[ -z "${BASE_SHA:-}" ]]; then
          echo "No pull_request base SHA; nothing to compare." >&2
          exit 3
        fi

        STATUS=0
        FOUND=0
        # git diff pathspecs accept the glob-ish patterns users pass as `paths`.
        while IFS= read -r FILE; do
          [[ -z "$FILE" ]] && continue
          if ! git cat-file -e "$BASE_SHA:$FILE" 2>/dev/null; then
            continue
          fi
          BEFORE="$(mktemp)"
          git show "$BASE_SHA:$FILE" > "$BEFORE"
          set +e
          ERR="$(mktemp)"
          node "$BIN" review --before "$BEFORE" --after "$FILE" --format "$FORMAT" > "${OUT}.part" 2>"$ERR"
          CODE=$?
          set -e
          if [[ $CODE -eq 3 ]]; then
            if grep -qi 'Expected an IAM policy' "$ERR"; then
              rm -f "$BEFORE" "$ERR" "${OUT}.part"
              continue
            fi
            cat "$ERR" >&2
            rm -f "$BEFORE" "$ERR"
            exit 3
          fi
          FOUND=1
          cat "${OUT}.part" > "$OUT"
          rm -f "$BEFORE" "$ERR" "${OUT}.part"
          if [[ $CODE -eq 1 ]]; then STATUS=1; fi
          if [[ $CODE -eq 2 && $STATUS -ne 1 ]]; then STATUS=2; fi
        done < <(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- $INPUT_PATHS || true)

        if [[ $FOUND -eq 0 ]]; then
          echo "No changed IAM policy files matching ${INPUT_PATHS}."
          if [[ "$FORMAT" == "sarif" ]]; then
            printf '%s\n' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"policylens","rules":[]}},"results":[]}]}' > "$OUT"
          else
            echo '{}' > "$OUT"
          fi
          exit 0
        fi
        exit $STATUS
