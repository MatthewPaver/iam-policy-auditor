# Fly.io — public hosted demo
app = "policylens-demo"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  HOSTED = "1"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 4177
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
